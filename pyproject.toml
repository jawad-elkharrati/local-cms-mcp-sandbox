[project]
name = "local-cms-mcp-sandbox"
version = "0.1.0"
description = "A local sandbox for connecting MCP clients to a fictional CMS"
requires-python = ">=3.12"
dependencies = [
  "aiofiles>=24.1",
  "alembic>=1.16",
  "asyncpg>=0.30",
  "fastapi>=0.116",
  "httpx>=0.28",
  "jinja2>=3.1",
  "markdown>=3.8",
  "mcp[cli]>=2,<3",
  "minio>=7.2",
  "pillow>=11.0",
  "prometheus-client>=0.22",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "redis>=6.0",
  "scikit-learn>=1.7",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "pytest-env>=1.1",
  "ruff>=0.12",
]

[project.scripts]
cms-mcp = "apps.mcp_server.transport:main"
cms-seed = "scripts.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages", "scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "B008", "B009", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
env = [
  "APP_ENV=test",
  "DATABASE_URL=sqlite+aiosqlite:///./.local-data/tests.db",
]
