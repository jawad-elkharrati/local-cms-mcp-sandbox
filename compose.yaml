services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms_lab}
      POSTGRES_USER: ${POSTGRES_USER:-cms_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms_lab_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["minio-data:/data"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  fake-blog:
    build: .
    command: uv run uvicorn apps.fake_blog.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]

  mcp-http:
    build: .
    command: uv run cms-mcp
    env_file: .env
    environment:
      MCP_TRANSPORT: streamable-http
      BLOG_API_BASE_URL: http://fake-blog:8000/api/v1
    depends_on:
      fake-blog: {condition: service_started}
    ports: ["127.0.0.1:8100:8100"]
    profiles: ["mcp-http"]

volumes:
  postgres-data:
  minio-data:
